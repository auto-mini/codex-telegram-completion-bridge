name: Release unsigned preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without a leading v
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned preview
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.win-x64.lock.json
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\CodexTelegramBridge.sln --locked-mode
      - name: Build
        shell: pwsh
        run: dotnet build .\CodexTelegramBridge.sln -c Release --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test .\CodexTelegramBridge.sln -c Release --no-build
      - name: Audit NuGet dependencies
        shell: pwsh
        run: .\scripts\assert-no-vulnerable-packages.ps1
      - name: Package and hash
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\scripts\package.ps1 -Version $env:RELEASE_VERSION
          $name = "CodexTelegramBridge-$env:RELEASE_VERSION-win-x64"
          $directory = Join-Path $PWD "artifacts\release\$name"
          $zip = Join-Path $PWD "artifacts\release\$name.zip"
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $directory).FullName -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile = "$zip.sha256"
          $outer = Join-Path $PWD "artifacts\release\$name.manifest.outer.sha256"
          "$zipHash  $name.zip" | Set-Content -LiteralPath $shaFile -Encoding ASCII
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$shaFile" >> $env:GITHUB_OUTPUT
          "outer=$outer" >> $env:GITHUB_OUTPUT
      - name: Upload workflow artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
            ${{ steps.package.outputs.outer }}
          if-no-files-found: error
          retention-days: 30
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip }}
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
          MANIFEST_OUTER: ${{ steps.package.outputs.outer }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release already exists: $tag"
          }
          $policy = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/code-signing-policy.md"
          $privacy = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/PRIVACY.md"
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @(
              "# UNSIGNED PREVIEW — no Authenticode signature",
              "",
              "This release is the public, reproducible package sample for review and the SignPath Foundation application. Windows may block it. Do not disable Smart App Control, Microsoft Defender, or another security control to run it.",
              "",
              "Verify $env:PACKAGE_ZIP against the attached SHA-256 file and GitHub build-provenance attestation.",
              "",
              "- [Code signing policy]($policy)",
              "- [Privacy policy]($privacy)",
              "",
              "Planned production signing: **Free code signing provided by SignPath.io, certificate by SignPath Foundation.** This artifact is not signed."
          ) | Set-Content -LiteralPath $notes -Encoding UTF8
          $arguments = @(
              "release", "create", $tag,
              $env:PACKAGE_ZIP, $env:PACKAGE_SHA, $env:MANIFEST_OUTER,
              "--target", $env:GITHUB_SHA,
              "--title", "Codex Telegram Completion Bridge $tag",
              "--notes-file", $notes
          )
          if ($env:PRERELEASE -eq "true") { $arguments += "--prerelease" }
          gh @arguments
