name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, audit, package
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.win-x64.lock.json
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\CodexTelegramBridge.sln --locked-mode
      - name: Build
        shell: pwsh
        run: dotnet build .\CodexTelegramBridge.sln -c Release --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test .\CodexTelegramBridge.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Audit NuGet dependencies
        shell: pwsh
        run: .\scripts\assert-no-vulnerable-packages.ps1
      - name: Smoke-test release packaging
        shell: pwsh
        run: .\scripts\package.ps1 -Version "0.0.0-ci.${{ github.run_number }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
